    <script id="boot-recovery">
      // Runs without the module graph: a missing dependency must not strand the loader.
      (() => {
        let finished = false;
        let shown = false;
        let failed = false;
        let statusMessage;
        const failureText = 'The valley could not finish opening. Try again in this same tab. Keep just one game tab open so your saved play stays protected.';
        const show = (isFailure = false) => {
          const cover = document.getElementById('boot-cover');
          if (finished || !cover) return;
          if (isFailure) failed = true;
          if (shown) {
            if (failed && statusMessage) statusMessage.textContent = failureText;
            return;
          }
          shown = true;
          cover.setAttribute('aria-label', 'Help opening the valley');
          cover.style.cssText = 'position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;background:#eef7ff;color:#49382f;text-align:center;font:18px/1.5 system-ui';
          const message = document.createElement('p');
          message.setAttribute('role', 'status');
          statusMessage = message;
          message.textContent = failed ? failureText : 'The valley is still opening. You can wait here, or try again in this same tab. Keep just one game tab open so your saved play stays protected.';
          message.style.maxWidth = '30ch';
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.textContent = 'Try again';
          retry.style.cssText = 'padding:14px 28px;border:3px solid #655044;border-radius:24px;background:#ffdfaa;color:#49382f;font:700 20px system-ui;cursor:pointer';
          retry.addEventListener('click', () => window.location.reload());
          cover.replaceChildren(message, retry);
        };
        const onError = event => {
          const target = event.target;
          if (target?.tagName === 'SCRIPT' && target.getAttribute('type') === 'module') show(true);
        };
        const onFailure = () => show(true);
        const timer = setTimeout(() => show(false), 20000);
        window.addEventListener('error', onError, true);
        window.addEventListener('valley:boot-failed', onFailure);
        window.addEventListener('valley:ready', () => {
          finished = true;
          clearTimeout(timer);
          window.removeEventListener('error', onError, true);
          window.removeEventListener('valley:boot-failed', onFailure);
        }, { once: true });
      })();
    </script>
