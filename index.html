    <script id="boot-recovery">
      // Runs without the module graph: a missing dependency must not strand the loader.
      // The child only ever sees the butterfly splash. A failed start retries by itself
      // (twice at most per tab); after about 10 seconds a wordless retry arrow appears
      // under the butterfly. A world already open in another tab is not a failure:
      // the app shows its own protection cover and this script steps aside.
      (() => {
        let finished = false;
        let retry = null;
        const timers = [];
        const RETRY_KEY = 'valley-boot-auto-retry';
        const RETRY_LIMIT = 2;
        const RETRY_WINDOW_MS = 120000;
        const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
        const store = () => { try { return window.sessionStorage || null; } catch (_) { return null; } };
        const retriesUsed = () => {
          try {
            const record = JSON.parse(store()?.getItem(RETRY_KEY) || 'null');
            return record && Date.now() - record.at < RETRY_WINDOW_MS ? record.count : 0;
          } catch (_) { return RETRY_LIMIT; }
        };
        // Reload by itself only when the tab can remember how often it already did.
        const autoRetry = () => {
          const storage = store();
          if (finished || !storage) return false;
          const used = retriesUsed();
          if (used >= RETRY_LIMIT) return false;
          try { storage.setItem(RETRY_KEY, JSON.stringify({ count: used + 1, at: Date.now() })); } catch (_) { return false; }
          later(() => { if (!finished) window.location.reload(); }, 1500);
          return true;
        };
        const showRetry = () => {
          const cover = document.getElementById('boot-cover');
          if (finished || retry || !cover) return;
          if (cover.getAttribute('role') === 'alertdialog') return;
          cover.style.cssText = 'position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;background:#eef7ff';
          retry = document.createElement('button');
          retry.type = 'button';
          retry.setAttribute('aria-label', 'Try again');
          retry.innerHTML = '<svg viewBox="0 0 64 64" width="56" height="56" fill="none" stroke="#49382f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 19a23 23 0 1 1-5 26M14 6v17H2"/></svg>';
          retry.style.cssText = 'display:grid;place-items:center;width:96px;height:96px;padding:0;border:3px solid #655044;border-radius:50%;background:#ffdfaa;cursor:pointer;touch-action:manipulation';
          retry.addEventListener('click', () => window.location.reload());
          cover.append(retry);
        };
        const fail = () => { if (!finished && !autoRetry()) showRetry(); };
        const onError = event => {
          const target = event.target;
          if (target?.tagName === 'SCRIPT' && target.getAttribute('type') === 'module') fail();
        };
        const stop = () => {
          finished = true;
          timers.forEach(clearTimeout);
          window.removeEventListener('error', onError, true);
          window.removeEventListener('valley:boot-failed', onFailure);
        };
        const onFailure = event => {
          if (event?.detail?.code === 'saved-world-busy') { stop(); return; }
          fail();
        };
        later(showRetry, 10000);
        later(() => { if (!finished) autoRetry(); }, 30000);
        window.addEventListener('error', onError, true);
        window.addEventListener('valley:boot-failed', onFailure);
        window.addEventListener('valley:ready', () => {
          stop();
          try { store()?.removeItem(RETRY_KEY); } catch (_) {}
        }, { once: true });
      })();
    </script>
